<!DOCTYPE html>
<html>
<head>
  <title>Add Material</title>

  <style>
    body {
      font-family: Arial;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: #1e1e1e;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 6px;
    }

    button {
      background: #00c853;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #00b34a;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>Add Material</h2>

  <input id="name" placeholder="wood, foam, tape, glue, straw">
  <input id="amount" type="number" placeholder="amount">

  <button onclick="send()">Add</button>
</div>

<script>
const API = "https://script.google.com/a/macros/jcpsnj.org/s/AKfycbycN8ebBz_7R6ZL53gcPkxibv4mLcQLFxQE6c_srnGkVImuPxPWCxg3MQMkMUGjZaWo/exec";

function send() {
  const name = document.getElementById("name").value.toLowerCase().trim();
  const amount = Number(document.getElementById("amount").value);

  if (!name || !amount) {
    alert("Fill in both fields!");
    return;
  }

  fetch(API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ name, amount })
  })
  .then(async res => {
    const text = await res.text();
    console.log("Server response:", text);
    alert("Sent to Google Doc 🚀");
  })
  .catch(err => {
    console.error(err);
    alert("Error sending data");
  });
}
</script>

</body>
</html>
